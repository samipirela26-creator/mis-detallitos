<!doctype html>
<html lang="es-VE">
<head>
  <meta charset="utf-8">
  <!-- Todas las rutas son RELATIVAS a propósito: así la app funciona igual
       en la raíz (Firebase Hosting) que dentro de una subcarpeta
       (GitHub Pages: usuario.github.io/mis-detallitos/). -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mis Detallitos</title>
  <meta name="description" content="Ventas, inventario y ganancias de Mis Detallitos.">
  <meta name="theme-color" content="#0b6a82">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icono-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icono-192.png">


  <!-- EL NÚMERO ES LA CASCADA. No reordenar estos cuatro <link>. -->
  <link rel="stylesheet" href="css/0-fuentes.css">
  <link rel="stylesheet" href="css/1-base.css">
  <link rel="stylesheet" href="css/2-layout.css">
  <link rel="stylesheet" href="css/3-componentes.css">
  <link rel="stylesheet" href="css/4-pantallas.css">
</head>
<body>
  <div id="app"><div class="cargando">Abriendo…</div></div>
  <div id="avisos"></div>

  <!-- Un solo script: el resto entra por imports de módulos ES. -->
  <script type="module" src="js/app.js"></script>
  <script>
    // Si la red titubea o el service worker está cambiando, dar salida visual rápida
    setTimeout(() => {
      const cargando = document.querySelector('#app > .cargando');
      if (cargando) {
        cargando.innerHTML = 'Abriendo…<br><button onclick="location.reload()" style="margin-top:1.2rem;padding:.6rem 1.2rem;font-size:var(--t-cuerpo,1rem);font-weight:600;border-radius:.6rem;border:1px solid var(--borde,#ccc);background:var(--blanco,#fff);color:var(--texto,#222);cursor:pointer">Toca aquí para refrescar</button>';
      }
    }, 3500);
  </script>
  <noscript>Esta app necesita JavaScript.</noscript>
</body>
</html>
