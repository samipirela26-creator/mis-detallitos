<!doctype html>
<!-- El catálogo de clientes va SIEMPRE en claro: es la cara de la tienda y
     tiene que verse igual en todos los teléfonos. El tema oscuro se queda
     para la app interna, que la usa el equipo. -->
<html lang="es-VE" data-tema="claro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Catálogo Digital · Mis Detallitos</title>
  <meta name="description" content="Catálogo digital de productos y pedidos por WhatsApp de Mis Detallitos G&M C.A.">
  <meta name="theme-color" content="#0b6a82">

  <!-- La tarjeta que se arma cuando el enlace se pega en WhatsApp o en un
       estado. Sin esto sale el enlace pelado y nadie lo abre. Las direcciones
       van ABSOLUTAS a propósito: quien lee estas etiquetas es un robot que no
       ejecuta JavaScript y no siempre resuelve rutas relativas. Si algún día
       el catálogo pasa a un dominio propio, hay que cambiarlas aquí. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Mis Detallitos G&M C.A.">
  <meta property="og:title" content="Catálogo digital · Mis Detallitos">
  <meta property="og:description" content="Papelería y detalles. Mira los precios, arma tu pedido y envíalo por WhatsApp.">
  <meta property="og:url" content="https://mis-detallitos.web.app/catalogo.html">
  <meta property="og:image" content="https://mis-detallitos.web.app/icons/icono-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta property="og:locale" content="es_VE">
  <meta name="twitter:card" content="summary">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icono-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icono-192.png">


  <!-- Estilos del sistema -->
  <link rel="stylesheet" href="css/0-fuentes.css">
  <link rel="stylesheet" href="css/1-base.css">
  <link rel="stylesheet" href="css/2-layout.css">
  <link rel="stylesheet" href="css/3-componentes.css">
  <link rel="stylesheet" href="css/4-pantallas.css">
  <link rel="stylesheet" href="css/5-catalogo.css">
</head>
<body class="cat-publico">
  <div id="app">
    <header class="cat-cabecera">
      <div class="fila-superior">
        <div class="marca-fila">
          <img class="logo" src="icons/logo.webp" alt="Mis Detallitos">
          <div>
            <div class="nombre">Mis Detallitos</div>
            <div class="lema">Papelería y detalles · G&amp;M C.A.</div>
          </div>
        </div>
        <div class="cat-buscador">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <label class="solo-lectores" for="q-cat">Buscar producto en el catálogo</label>
          <input id="q-cat" type="search" placeholder="Buscar en el catálogo…" autocomplete="off">
        </div>
        <button id="btn-pedido-cabecera" class="cat-pedido-btn" type="button" aria-label="Ver mi pedido" hidden>
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 4 6v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V6l-2-4z"/><path d="M4 6h16"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="contador" id="contador-pedido">0</span>
        </button>
      </div>
      <div class="titular">
        <h1>Catálogo digital<br>para tus detalles</h1>
        <p class="intro">Elige lo que necesitas, arma tu pedido y envíalo por WhatsApp. Precios en dólares con su equivalente a la tasa del día.</p>
      </div>
    </header>

    <main id="contenido" class="cat-cuerpo">
      <div class="cargando">Cargando catálogo digital…</div>
    </main>

    <footer class="cat-pie">
      <div class="dentro">
        <span>Mis Detallitos G&amp;M C.A.</span>
        <a id="pie-whatsapp" href="https://wa.me/">Pedidos por WhatsApp</a>
      </div>
    </footer>
  </div>
  <div id="avisos"></div>

  <!-- Script independiente para clientes (sin funciones administrativas ni login) -->
  <script type="module" src="js/catalogo-standalone.js"></script>
  <noscript>El catálogo necesita JavaScript para cargar los productos.</noscript>
</body>
</html>
